image: python:3.12-slim

pages:
  stage: deploy
  before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - pip install -r requirements-docs.txt
    - mkdocs build --site-dir public
    - ssh -o "UserKnownHostsFile=$KNOWN_HOSTS" janus@projects.astec.ac.uk "mkdir -p /var/www/html/janus"
    - tar -C public -cf - . | ssh -o "UserKnownHostsFile=$KNOWN_HOSTS" janus@projects.astec.ac.uk "tar -C /var/www/html/janus -xf -"
    - ssh -o "UserKnownHostsFile=$KNOWN_HOSTS" janus@projects.astec.ac.uk "test -s /var/www/html/janus/assets/janus-logo.png"
  artifacts:
    paths:
      - public
  only:
    - main
    - develop
