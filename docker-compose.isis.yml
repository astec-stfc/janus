include:
  - compose/core.yml
  - compose/isis.yml

services:

  restframe:
    extends:
      file: compose/overrides.yml
      service: restframe
    environment:
      - FACILITY=ISIS
    volumes:
      - ./apps/api/restframe/ISIS:/home/web/webapp/Output/ISIS
  sandbox:
    extends:
      file: compose/overrides.yml
      service: sandbox
    user: "janus-developer"
    environment:
      - EPICS_CA_SERVER_PORT=6090
      - EPICS_PVA_NAME_SERVERS=physics_iocs:${PHYSICS_PORT:-6091}

  lattice_api:
    extends:
      file: compose/overrides.yml
      service: lattice_api
    env_file:
      - ./apps/api/lattice/.env.dev
    environment:
      - FACILITY=ISIS

  frontend:
    extends:
      file: compose/overrides.yml
      service: frontend