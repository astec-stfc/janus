services:
  # Virtual accelerator IOC generated from the JFEL LAURA lattice by SARABI.
  ioc:
    build:
      context: ../apps/controls/shared/virtual-accelerator/
      dockerfile: Dockerfile
      ssh:
        - default
      args:
        FACILITY: JFEL
    tty: true
    ports:
      - ${PORT:-6090}:${PORT:-6090}/tcp
      - ${PORT:-6090}:${PORT:-6090}/udp
      - ${PVA_PORT:-6092}:${PVA_PORT:-6092}/tcp
      - ${PVA_PORT:-6092}:${PVA_PORT:-6092}/udp
    environment:
      - EPICS_CA_SERVER_PORT=${PORT:-6090}
      - EPICS_CAS_SERVER_PORT=${PORT:-6090}
      - EPICS_CA_AUTO_ADDR_LIST=NO
      - EPICS_CA_ADDR_LIST=localhost
      - EPICS_PVA_AUTO_ADDR_LIST=YES
      - EPICS_PVA_ADDR_LIST=
      - EPICS_PVAS_SERVER_PORT=${PVA_PORT:-6092}
      - EPICS_PVA_SERVER_PORT=${PVA_PORT:-6092}
      - EPICS_PVA_BROADCAST_PORT=${PVA_PORT:-6092}
      - EPICS_PVAS_BROADCAST_PORT=${PVA_PORT:-6092}
