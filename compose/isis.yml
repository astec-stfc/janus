services:
  # Virtual ISIS IOCs
  isis_iocs:
    build: ../apps/controls/isis/
    environment:
      - PYTHONUNBUFFERED=1
      - EPICS_PVA_SERVER_PORT=${PORT:-6090}
      - EPICS_PVAS_SERVER_PORT=${PORT:-6090}
      - EPICS_PVA_BROADCAST_PORT=${PORT:-6090}  # this is required to allow pvget to work in sandbox
      - EPICS_PVA_AUTO_ADDR_LIST=YES
      - EPICS_PVAS_INTF_ADDR_LIST=
      - EPICS_PVA_ADDR_LIST=
    ports:
      - ${PORT:-6090}:${PORT:-6090}/tcp
      - ${PORT:-6090}:${PORT:-6090}/udp
    volumes:
      - ../janus_common:/src/app/janus_common
