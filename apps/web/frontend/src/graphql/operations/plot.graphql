query GetRunUuids {
  getRunUuids
}

query GetScreenNames($uuid: String!) {
  getScreenNames(uuid: $uuid)
}

query GetMarkerNames($uuid: String!) {
  getMarkerNames(uuid: $uuid)
}

query GetBeamSummary($uuid: String!) {
  getBeamSummary(uuid: $uuid) {
    uuid
    facility
    beamSummaryData {
      xParameter {
        name
        label
        unit
        domainPathTuple
      }
      yParameters {
        name
        label
        domainPathTuple
      }
    }
  }
}
